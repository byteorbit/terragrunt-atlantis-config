name: Build and test code
on:
  push:
    branches:
    - master
  pull_request:
    types: [opened, synchronize, reopened]


jobs:
  run-tests:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    env:
      MISE_PROFILE: cicd
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
    steps:
      - uses: actions/checkout@v4

      # install dependencies for the integration tests
      - name: Use mise to install dependencies
        uses: jdx/mise-action@v2
        with:
          version: 2025.4.4
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ matrix.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-go-

      - name: Run Tests
        id: run-tests
        run: |
          set -o pipefail
          go test -v ./... -timeout 45m | go-junit-report -set-exit-code > result.xml
        shell: bash
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JUnit XML Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: result.xml

      - name: Display JUnit Results with action-junit-report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: result.xml
          detailed_summary: 'true'
          include_time_in_summary: 'true'
          group_suite: 'true'